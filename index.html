<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="DART BUDDY – der freche KI-Dart-Moderator: rechnet, hört zu und klopft Sprüche." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DART BUDDY</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="nav" data-screen="home" aria-label="Startseite">
      <span class="brand-dart" aria-hidden="true">🎯</span>
      <span class="brand-text">DART<b>BUDDY</b></span>
    </button>
    <nav class="topnav" aria-label="Navigation">
      <button data-action="nav" data-screen="jokes" aria-label="Sprüche-Bibliothek">💬</button>
      <button data-action="nav" data-screen="stats" aria-label="Statistik">📊</button>
      <button data-action="nav" data-screen="settings" aria-label="Einstellungen">⚙️</button>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <noscript>DART BUDDY benötigt JavaScript.</noscript>
  <!-- Capacitor-Laufzeit (für die Android-/iPhone-App: native Plugins wie Mikrofon und Sprachausgabe).
       Im normalen Browser ohne Wirkung. Quelle: @capacitor/core/dist/capacitor.js -->
  <script src="vendor/capacitor.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
